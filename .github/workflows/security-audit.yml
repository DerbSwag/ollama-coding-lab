name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/security-audit-pipeline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Gate Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            shell: powershell
          - os: ubuntu-24.04
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false

      - name: Test gate failure handling
        run: ./tests/Test-SecurityGate.ps1

      - name: Upload contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: gate-contracts-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .evidence/gate-test-*/test-results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  static-analysis:
    name: Static Analysis Gate
    needs: contract-tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false

      - name: Require passing contracts
        shell: pwsh
        env:
          CONTRACT_RESULT: ${{ needs.contract-tests.result }}
        run: |
          if ($env:CONTRACT_RESULT -ne 'success') {
            throw 'Mandatory contract tests did not succeed.'
          }

      - name: Enforce baseline policy and verify insecure fixture rejection
        shell: pwsh
        run: ./tests/Test-ScannerIntegration.ps1

      - name: Upload static analysis evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .evidence/environment.json
            .evidence/gate.json
            .evidence/hadolint.json
            .evidence/trivy.json
            .evidence/scanner-integration-*/test-results.json
            .evidence/scanner-integration-*/insecure/.evidence/environment.json
            .evidence/scanner-integration-*/insecure/.evidence/gate.json
            .evidence/scanner-integration-*/insecure/.evidence/hadolint.json
            .evidence/scanner-integration-*/insecure/.evidence/trivy.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
